<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fbfaf6">
<title>English Lab · 今日</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon.png">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<main>
  <p class="kicker" id="dateline">—</p>
  <h1>今天</h1>

  <div class="hero">
    <div class="row">
      <div class="grow"><div class="big" id="streak">0</div><div class="sub">連續天數</div></div>
      <div style="text-align:right"><div style="font-size:22px;font-weight:800" id="month">0</div><div class="sub">本月做了幾天</div><div style="font-size:14px;margin-top:6px" id="total"></div></div>
    </div>
    <div style="margin-top:12px" class="row">
      <button class="btn primary grow" id="doneBtn">今天完成 ✓</button>
      <button class="btn small ghost" id="lightBtn">輕量日</button>
    </div>
    <p class="muted" id="hint" style="margin:10px 0 0"></p>
  </div>

  <h2 style="margin-top:22px">必做 <span class="pill" id="mustSum"></span></h2>
  <div class="card" id="must"></div>

  <h2>加碼 <span class="pill gray" id="extraSum"></span></h2>
  <div class="card" id="extra"></div>

  <details style="margin-top:18px"><summary>規則</summary><ul id="rules" class="muted" style="padding-left:20px"></ul></details>
  <details><summary>最近 14 天</summary><div id="history" class="chips" style="margin-top:8px"></div></details>
  <div id="auth" class="row" style="margin-top:26px;font-size:13px;align-items:center;gap:10px;flex-wrap:wrap"></div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js" onerror="void 0"></script>
<script src="assets/app.js"></script>
<script>
(async function(){
  const {Store, dkey, addDays, weekday, loadJSON, toast, getLog, markTask, setDayDone, streak, monthCount, totalCount} = EL;
  const today = dkey();
  const plan = await loadJSON('content/plan.json');
  const wd = ['日','一','二','三','四','五','六'][weekday(today)];
  document.getElementById('dateline').textContent = `${today} · 週${wd}`;
  document.getElementById('rules').innerHTML = plan.rules.map(r=>`<li>${r}</li>`).join('');

  function render(){
    const log = getLog(); const day = log[today] || {tasks:{}};
    const light = !!day.light;
    const screened = Store.get('vocab.screenDone', false);
    const visible = plan.tasks.filter(t => !(t.until==='screened' && screened));
    const must = visible.filter(t => light ? t.light : t.tier==='must');
    const extra = light ? [] : visible.filter(t => t.tier==='extra');
    const sum = arr => arr.reduce((a,t)=>a+(light&&t.lightMin?t.lightMin:t.min),0);
    document.getElementById('mustSum').textContent = `${sum(must)} 分`;
    document.getElementById('extraSum').textContent = extra.length? `${sum(extra)} 分` : '輕量日不顯示';
    const item = t => {
      const on = !!(day.tasks||{})[t.id];
      const m = light&&t.lightMin?t.lightMin:t.min;
      return `<div class="task ${on?'done':''}" data-id="${t.id}">
        <button class="check ${on?'on':''}" aria-label="完成">✓</button>
        <div class="grow"><div class="t">${t.title}${t.voice?' <span class="pill warn">出聲</span>':''}</div>
        <div class="m">${m} 分 · ${t.when}${t.desc?' · '+t.desc:''}</div></div>
        <a class="btn small" href="${t.href}" ${t.external?'target="_blank" rel="noopener"':''}>去</a></div>`;
    };
    document.getElementById('must').innerHTML = must.map(item).join('') || '<p class="muted">今天沒有必做項目</p>';
    document.getElementById('extra').innerHTML = extra.map(item).join('') || '<p class="muted">輕量日沒有加碼</p>';
    const allMust = must.length && must.every(t=>(day.tasks||{})[t.id]);
    const doneBtn = document.getElementById('doneBtn');
    doneBtn.textContent = day.done ? '今天完成了 ✓' : (allMust ? '必做都勾了，按這裡完成' : '今天完成 ✓');
    doneBtn.className = 'btn grow ' + (day.done?'ok':'primary');
    document.getElementById('lightBtn').textContent = light ? '輕量日 ✓' : '輕量日';
    document.getElementById('hint').textContent = light ? '輕量日：只做兩項，做完一樣算完成。' : (day.done ? '做完了。明天見。' : '必做全部打勾後按「今天完成」；很累就按輕量日。');
    document.getElementById('streak').textContent = streak(today);
    document.getElementById('month').textContent = monthCount(today);
    document.getElementById('total').textContent = `累計 ${totalCount()} 天`;
    // history chips
    const hist = []; for(let i=13;i>=0;i--){ const d=addDays(today,-i); const l=log[d]; hist.push(`<span class="pill ${l&&l.done?'ok':'gray'}" title="${d}">${d.slice(5)}${l&&l.done?(l.light?' 輕':' ✓'):''}</span>`); }
    document.getElementById('history').innerHTML = hist.join('');
  }
  document.body.addEventListener('click', e => {
    const chk = e.target.closest('.check'); if(chk){ const id = chk.closest('.task').dataset.id; const on = !chk.classList.contains('on'); markTask(today, id, on); render(); return; }
    if(e.target.id==='doneBtn'){ const log=getLog(); const was=log[today]&&log[today].done; setDayDone(today, !was); toast(was?'取消完成':'今天完成！'); render(); }
    if(e.target.id==='lightBtn'){ Store.update('log', l=>{ l[today]=l[today]||{tasks:{}}; l[today].light=!l[today].light; return l; },{}); render(); }
  });
  render();
  document.addEventListener('el:remote-loaded', render);
  EL.renderAuth();
  EL.initFirebase();
})();
</script>
</body>
</html>
