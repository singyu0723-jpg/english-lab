<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f3f0">
<title>English Lab 今日</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon.png">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<main>
  <header class="today-head">
    <p class="date" id="dateline">&nbsp;</p>
    <h1>今天的清單</h1>
    <p class="streakline" id="streakline">&nbsp;</p>
  </header>

  <section class="strip" aria-label="最近 14 天">
    <div class="days" id="history"></div>
    <div class="lab"><span id="histFrom"></span><span>今天</span></div>
  </section>

  <div class="listhead"><h2>必做</h2><span class="sum" id="mustSum"></span></div>
  <ul class="checklist" id="must"></ul>

  <div class="daybar">
    <button class="btn primary" id="doneBtn">今天完成</button>
    <button class="btn" id="lightBtn">改成輕量日</button>
  </div>
  <p class="muted hint" id="hint"></p>

  <div class="listhead"><h2>加碼</h2><span class="sum" id="extraSum"></span></div>
  <ul class="checklist" id="extra"></ul>

  <div class="foot">
    <details><summary>規則</summary><ul id="rules" class="muted" style="padding-left:20px"></ul></details>
    <div id="auth" class="row" style="margin-top:14px;font-size:13px;align-items:center;gap:10px;flex-wrap:wrap"></div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js" onerror="void 0"></script>
<script src="assets/app.js"></script>
<script>
(async function(){
  const {Store, dkey, addDays, weekday, loadJSON, toast, getLog, markTask, setDayDone, streak, monthCount, totalCount} = EL;
  const today = dkey();
  const plan = await loadJSON('content/plan.json');
  const wd = ['日','一','二','三','四','五','六'][weekday(today)];
  { const [y,m,d]=today.split('-'); document.getElementById('dateline').textContent = `${Number(m)} 月 ${Number(d)} 日，星期${wd}`; }
  document.getElementById('rules').innerHTML = plan.rules.map(r=>`<li>${r}</li>`).join('');

  function render(){
    const log = getLog(); const day = log[today] || {tasks:{}};
    const light = !!day.light;
    const screened = Store.get('vocab.screenDone', false);
    const visible = plan.tasks.filter(t => !(t.until==='screened' && screened));
    const must = visible.filter(t => light ? t.light : t.tier==='must');
    const extra = light ? [] : visible.filter(t => t.tier==='extra');
    const mins = t => light&&t.lightMin?t.lightMin:t.min;
    const sum = arr => arr.reduce((a,t)=>a+mins(t),0);
    const doneN = arr => arr.filter(t=>(day.tasks||{})[t.id]).length;
    document.getElementById('mustSum').textContent = must.length ? `${doneN(must)}／${must.length} 項，共 ${sum(must)} 分鐘` : '';
    document.getElementById('extraSum').textContent = extra.length ? `有空再做，共 ${sum(extra)} 分鐘` : '';
    const item = t => {
      const on = !!(day.tasks||{})[t.id];
      const meta = [`${mins(t)} 分鐘`, t.when==='回家'?'回家做':'上班做', t.voice?'<span class="voice">要出聲</span>':'', t.desc||''].filter(Boolean).join('，');
      return `<li class="task ${on?'done':''}" data-id="${t.id}">
        <button class="check ${on?'on':''}" aria-label="${on?'取消勾選':'勾選完成'}：${t.title}" aria-pressed="${on}">✓</button>
        <div class="grow"><div class="t">${t.title}</div><div class="m">${meta}</div></div>
        <a class="btn small go" href="${t.href}" ${t.external?'target="_blank" rel="noopener"':''}>開始</a></li>`;
    };
    document.getElementById('must').innerHTML = must.map(item).join('') || '<li class="muted" style="padding:12px 0">今天沒有必做項目</li>';
    document.getElementById('extra').innerHTML = extra.map(item).join('') || `<li class="muted" style="padding:12px 0">${light?'輕量日不做加碼。':'沒有加碼項目。'}</li>`;
    const allMust = must.length && must.every(t=>(day.tasks||{})[t.id]);
    const doneBtn = document.getElementById('doneBtn');
    doneBtn.textContent = day.done ? '今天已完成' : (allMust ? '必做都勾了，按這裡完成今天' : '今天完成');
    doneBtn.className = 'btn ' + (day.done?'ok':'primary');
    document.getElementById('lightBtn').textContent = light ? '改回一般日' : '改成輕量日';
    document.getElementById('hint').textContent = light ? '輕量日只做兩項，做完一樣算完成。' : (day.done ? '今天做完了，明天見。' : '必做全部勾完再按「今天完成」。很累的話改成輕量日。');
    const st = streak(today), mo = monthCount(today), tot = totalCount();
    document.getElementById('streakline').innerHTML = st
      ? `已經連續 <b>${st}</b> 天，這個月做了 <b>${mo}</b> 天，總共 <b>${tot}</b> 天。`
      : (tot ? `這個月做了 <b>${mo}</b> 天，總共 <b>${tot}</b> 天。今天做完就重新開始連續。` : '今天是第一天。把必做勾完就開始累積。');
    const cells = []; for(let i=13;i>=0;i--){ const d=addDays(today,-i); const l=log[d];
      const cls = l&&l.done ? (l.light?'done light':'done') : '';
      const label = `${d.slice(5).replace('-','/')}${l&&l.done?(l.light?' 輕量日完成':' 完成'):' 沒做'}`;
      cells.push(`<span class="d ${cls} ${d===today?'today':''}" title="${label}" aria-label="${label}"></span>`); }
    document.getElementById('history').innerHTML = cells.join('');
    document.getElementById('histFrom').textContent = addDays(today,-13).slice(5).replace('-','/');
  }
  document.body.addEventListener('click', e => {
    const chk = e.target.closest('.check'); if(chk){ const id = chk.closest('.task').dataset.id; const on = !chk.classList.contains('on'); markTask(today, id, on); render(); return; }
    if(e.target.id==='doneBtn'){ const log=getLog(); const was=log[today]&&log[today].done; setDayDone(today, !was); toast(was?'已取消今天完成':'今天完成了'); render(); }
    if(e.target.id==='lightBtn'){ Store.update('log', l=>{ l[today]=l[today]||{tasks:{}}; l[today].light=!l[today].light; return l; },{}); render(); }
  });
  render();
  document.addEventListener('el:remote-loaded', render);
  EL.renderAuth();
  EL.initFirebase();
})();
</script>
</body>
</html>
